<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krono - Recuperar contraseña</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #F7F8FC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #E3E6EE;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 22px; color: #1B1F2E; margin: 0 0 8px; }
    p  { font-size: 14px; color: #6B7280; line-height: 1.5; }
    a.btn {
      display: inline-block;
      margin-top: 16px;
      background: #0B5BC4;
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
    }
    .error { color: #B3261E; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Recuperar contraseña</h1>
    <p id="msg">Abriendo la app Krono…</p>
    <a id="btn" class="btn" href="#" style="display:none">Abrir la app</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var userId = params.get("userId");
      var secret = params.get("secret");
      var msg = document.getElementById("msg");
      var btn = document.getElementById("btn");

      if (!userId || !secret) {
        msg.textContent = "El enlace no es válido o está incompleto. Solicita uno nuevo desde la app.";
        msg.className = "error";
        return;
      }

      var query = "userId=" + encodeURIComponent(userId) +
                  "&secret=" + encodeURIComponent(secret);

      // Deep link directo
      var deepLink = "kronocorp://recovery?" + query;

      // En Android Chrome, el esquema "intent://" es más confiable
      var intentLink = "intent://recovery?" + query +
        "#Intent;scheme=kronocorp;package=com.example.krono_corp;end";

      var esAndroid = /android/i.test(navigator.userAgent);
      var destino = esAndroid ? intentLink : deepLink;

      btn.href = destino;
      btn.style.display = "inline-block";
      msg.textContent = "Si la app no se abre automáticamente, toca el botón.";

      window.location.href = destino;
    })();
  </script>
</body>
</html>
